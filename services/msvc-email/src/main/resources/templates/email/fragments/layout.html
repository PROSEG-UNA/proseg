<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, headerTitle, headerSubtitle, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">Notificación</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;">
                <tr>
                    <td style="background:#b91c1c;padding:22px 24px;color:#ffffff;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="vertical-align:middle;">
                                    <h1 style="margin:0;font-size:22px;line-height:1.25;font-weight:700;" th:text="${headerTitle}">Notificación</h1>
                                    <p style="margin:8px 0 0 0;font-size:14px;opacity:0.95;" th:if="${headerSubtitle != null and !#strings.isEmpty(headerSubtitle)}" th:text="${headerSubtitle}">Información del sistema</p>
                                </td>
                                <td align="right" style="vertical-align:middle;">
                                    <img src="cid:flower.png" th:alt="|${brandName} LOGO|" alt="PROSEG LOGO" width="42" height="42" style="display:block;border-radius:10px;background:rgba(255,255,255,0.12);padding:4px;"/>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:28px 24px;" th:insert="${content}">
                        Contenido del correo.
                    </td>
                </tr>

                <tr>
                    <td style="background:#f9fafb;padding:14px 24px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;text-align:center;">
                        Mensaje automático · <span th:text="${brandName}">PROSEG</span>
                    </td>
                </tr>
                <tr>
                    <td style="background:#fef2f2;padding:12px 24px;border-top:1px solid #fee2e2;font-size:12px;color:#991b1b;text-align:center;line-height:1.6;">
                        Este mensaje fue generado automáticamente por
                        <span th:text="|${brandFullName} (${brandName})|">Programa de Servicios Generales (PROSEG)</span>.
                        Las respuestas a este correo no son monitoreadas.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
