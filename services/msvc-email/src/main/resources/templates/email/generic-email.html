<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>SSSI EMAIL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background-color: #f5f5f5;
            font-family: "Lato", Arial, sans-serif;
        }

        .email-container {
            max-width: 560px;
            margin: auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e8e8e8;
        }

        .header {
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .header .title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
        }

        #logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: block;
        }

        .content {
            padding: 28px;
        }

        .accent {
            width: 32px;
            height: 2px;
            background-color: #0f3460;
            border-radius: 2px;
            margin-bottom: 18px;
        }

        .content p {
            font-size: 14px;
            line-height: 1.75;
            color: #444444;
            font-family: Arial, sans-serif;
        }

        .content .greeting {
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .content .greeting span {
            font-weight: 600;
        }

        .footer {
            padding: 14px 28px;
            border-top: 1px solid #e8e8e8;
        }

        .footer p {
            font-size: 11px;
            color: #aaaaaa;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 8px;
            }

            .header,
            .content,
            .footer {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">

    <div class="header">
        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
            <tr>
                <td style="vertical-align: middle;">
                    <div class="title" th:text="${emailTitle}"></div>
                </td>

                <td align="right" style="vertical-align: middle;">
                    <img id="logo" src="cid:logo-4.png" alt="SSSI LOGO"/>
                </td>
            </tr>
        </table>
    </div>

    <div class="content">
        <div class="accent"></div>
        <p class="greeting">Estimado/a <span th:text="${userName}"></span>,</p>
        <p th:utext="${emailContent}"></p>
    </div>

    <div class="footer">
        <p>Mensaje automático &middot; SSSI</p>
    </div>

</div>
</body>
</html>
