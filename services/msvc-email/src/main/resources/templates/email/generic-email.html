<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>SSSI EMAIL</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;
             font-family:Arial,Helvetica,sans-serif;color:#1f2937;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="background:#f4f6f8;padding:24px 12px;">

    <tr>
        <td align="center">
            <table role="presentation" width="620" cellspacing="0" cellpadding="0"
                   style="max-width:620px;
                          background:#ffffff;
                          border-radius:10px;
                          overflow:hidden;
                          border:1px solid #e5e7eb;">

                <tr>
                    <td style="background:#b91c1c;
                               padding:22px 24px;
                               color:#ffffff;">

                        <table role="presentation"
                               width="100%"
                               cellspacing="0"
                               cellpadding="0">

                            <tr>

                                <td style="vertical-align:middle;">

                                    <h1 style="margin:0;
                                               font-size:22px;
                                               line-height:1.25;
                                               font-weight:700;"
                                        th:text="${emailTitle}">
                                        PROSEG Notification
                                    </h1>

                                    <p style="margin:8px 0 0 0;
                                              font-size:14px;
                                              opacity:0.95;">

                                        Sistema Programa Servicios Generales

                                    </p>

                                </td>

                                <td align="right"
                                    style="vertical-align:middle;">

                                    <img
                                            src="cid:flower.png"
                                            alt="SSSI LOGO"
                                            width="42"
                                            height="42"
                                            style="display:block;
                                                   border-radius:10px;
                                                   background:rgba(255,255,255,0.12);
                                                   padding:4px;"
                                    />

                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <tr>
                    <td style="padding:28px 24px;">

                        <p style="margin:0 0 16px 0;
                                  font-size:15px;
                                  line-height:1.6;
                                  color:#374151;">

                            Estimado/a
                            <strong th:text="${userName}">
                                Usuario
                            </strong>,

                        </p>

                        <table role="presentation"
                               width="100%"
                               cellspacing="0"
                               cellpadding="0"
                               style="border:1px solid #e5e7eb;
                                      border-radius:8px;
                                      background:#f9fafb;
                                      margin-bottom:24px;">

                            <tr>

                                <td style="padding:18px 18px;
                                           font-size:14px;
                                           line-height:1.75;
                                           color:#374151;"
                                    th:utext="${emailContent}">

                                    Contenido del correo...

                                </td>

                            </tr>

                        </table>

                        <table role="presentation"
                               width="100%"
                               cellspacing="0"
                               cellpadding="0"
                               style="border-left:4px solid #b91c1c;
                                      background:#fef2f2;
                                      border-radius:4px;
                                      margin-bottom:20px;">

                            <tr>

                                <td style="padding:12px 14px;
                                           font-size:13px;
                                           color:#991b1b;
                                           line-height:1.6;">

                                    Este es un mensaje automático generado por PROSEG.
                                    Por favor no respondás directamente a este correo.

                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <tr>
                    <td style="background:#f9fafb;
                               padding:14px 24px;
                               border-top:1px solid #e5e7eb;
                               font-size:12px;
                               color:#9ca3af;
                               text-align:center;">

                        Mensaje automático · SSSI

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
