<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Contraseña actualizada', 'Contraseña actualizada correctamente', 'Tu contraseña fue modificada exitosamente.', ~{::section})}">
<section>
<p style="margin:0 0 16px 0;font-size:15px;">
                            Hola <strong th:text="${firstName + ' ' + lastName}">Usuario</strong>,
                        </p>

                        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#374151;">
                            Te informamos que la contraseña de tu cuenta en <strong th:text="${brandName}">PROSEG</strong>
                            fue actualizada correctamente.
                        </p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                               style="border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;margin-bottom:24px;">

                            <tr>
                                <td style="padding:12px 14px;font-size:14px;border-bottom:1px solid #e5e7eb;">
                                    <strong>Usuario:</strong>
                                    <span th:text="${username}">usuario</span>
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:12px 14px;font-size:14px;">
                                    <strong>Email:</strong>
                                    <span th:text="${email}">correo@dominio.com</span>
                                </td>
                            </tr>

                        </table>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                               style="border-left:4px solid #f59e0b;
                                      background:#fffbeb;
                                      border-radius:4px;
                                      margin-bottom:24px;">

                            <tr>
                                <td style="padding:12px 14px;font-size:13px;color:#92400e;line-height:1.5;">
                                    Si no realizaste este cambio, contacta inmediatamente a soporte o administra tu
                                    cuenta.
                                </td>
                            </tr>

                        </table>

                        <p style="margin:0 0 24px 0;text-align:center;">
                            <a th:href="${loginUrl}"
                               style="display:inline-block;background:#b91c1c;color:#ffffff;text-decoration:none;
                                      padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600;">
                                Ingresar al sistema
                            </a>
                        </p>

                        <p style="margin:0;font-size:12px;color:#6b7280;">
                            Cambio realizado el: <span th:text="${timestamp}">01/01/2026 00:00</span>
                        </p>
</section>
</html>
