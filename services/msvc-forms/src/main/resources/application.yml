server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: msvc-forms
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://msvc-config:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/auth/realms/proseg-realm}

routes:
  forms: /api/v1/forms

gateway:
  base-url: ${GATEWAY_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
