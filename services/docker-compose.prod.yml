services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - sssi-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://76.13.124.126:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - sssi-net

  msvc-config:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-config
    container_name: msvc-config
    environment:
      - SPRING_PROFILES_ACTIVE=${CONFIG_SERVER_PROFILES_ACTIVE:-prod,native}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8888 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - sssi-net

  msvc-eureka:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-eureka
    container_name: msvc-eureka
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-eureka}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8761 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      msvc-config:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-gateway:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-gateway
    container_name: msvc-gateway
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=msvc-gateway
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - SERVICES_AUTH_URL=${SERVICES_AUTH_URL:-http://msvc-auth:8090}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://msvc-auth:8090}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://msvc-gateway:8081}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL:-http://msvc-email:9090}
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://msvc-inventory:8095}
      - ARCHIVE_SERVICE_URL=${ARCHIVE_SERVICE_URL:-http://msvc-archive:8096}
      - TRANSPORT_SERVICE_URL=${TRANSPORT_SERVICE_URL:-http://msvc-transport:8097}
      - DOCUMENT_PROCESSOR_SERVICE_URL=${DOCUMENT_PROCESSOR_SERVICE_URL:-http://msvc-document-processor:8098}
      - MAINTENANCE_SERVICE_URL=${MAINTENANCE_SERVICE_URL:-http://msvc-maintenance:8099}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://proseg.devbychris.com}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
      msvc-auth:
        condition: service_started
    networks:
      - sssi-net

  msvc-auth:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-auth
    container_name: msvc-auth
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8090
      - SPRING_APPLICATION_NAME=msvc-auth
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-auth}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:-https://auth.devbychris.com}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-sssi-realm}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-sssi-app}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-Dl8QcQxHHmu6qERkUMmUJ0qWSulRRx6y}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-sssi_user}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-0x4AAAAAADEo_xVst3UEPKg1xo7CgackmKA}
      - TURNSTILE_MAX_RETRIES=${TURNSTILE_MAX_RETRIES:-3}
      - TURNSTILE_DEV_MODE=${TURNSTILE_DEV_MODE:-false}
    depends_on:
      kafka:
        condition: service_healthy
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sS -X POST http://localhost:8090/api/auth/login -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' | grep -E '200|400|401|403' >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - sssi-net

  msvc-inventory:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-inventory
    container_name: msvc-inventory
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8095
      - SPRING_APPLICATION_NAME=msvc-inventory
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://76.13.124.126:5432/sssi-bd}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sssi_user}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-sssi_user}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-false}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-inventory}
      - ARCHIVE_BASE_URL=${ARCHIVE_BASE_URL:-http://msvc-gateway:8081}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-archive:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-archive
    container_name: msvc-archive
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8096
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-archive}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - MINIO_URL=${MINIO_URL:-http://minio.devbychris.com:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin12345}
      - MINIO_BUCKET=${MINIO_BUCKET:-sssi-prod}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-transport:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-transport
    container_name: msvc-transport
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8097
      - SPRING_APPLICATION_NAME=msvc-transport
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://auth.devbychris.com/realms/sssi-realm}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-transport}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-document-processor:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-document-processor
    container_name: msvc-document-processor
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8098
      - SPRING_APPLICATION_NAME=msvc-document-processor
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-document-processor}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-email:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-email
    container_name: msvc-email
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=9090
      - SPRING_APPLICATION_NAME=msvc-email
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-email}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-noreply.prostep@gmail.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-rwuj zaeq hrgm znge}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:-5000}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:-5000}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:-5000}
      - SPRING_MAIL_PROPERTIES_MAIL_DEBUG=${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:-false}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID:-msvc-email}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET:-0wqysXJSiZurqXEE9TZSzDk4rhHq2kKY}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE=client_credentials
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI:-https://auth.devbychris.com/realms/sssi-realm/protocol/openid-connect/token}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://msvc-gateway:8081}
      - APP_URLS_LOGIN=${APP_URLS_LOGIN:-https://proseg.devbychris.com/login}
      - APP_URLS_APPROVALS=${APP_URLS_APPROVALS:-https://proseg.devbychris.com/login}
      - APP_URLS_SET_PASSWORD=${APP_URLS_SET_PASSWORD:-https://proseg.devbychris.com/set-password}
      - APP_URLS_RESET_PASSWORD=${APP_URLS_RESET_PASSWORD:-https://proseg.devbychris.com/reset-password}
    depends_on:
      kafka:
        condition: service_healthy
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

  msvc-maintenance:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE_NAME: msvc-maintenance
    container_name: msvc-maintenance
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://msvc-config:8888}
      - SERVER_PORT=8099
      - SPRING_APPLICATION_NAME=msvc-maintenance
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://76.13.124.126:5432/sssi-bd}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sssi_user}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-sssi_user}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-false}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://msvc-eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME:-msvc-maintenance}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://msvc-gateway:8081}
    depends_on:
      msvc-config:
        condition: service_healthy
      msvc-eureka:
        condition: service_healthy
    networks:
      - sssi-net

networks:
  sssi-net:
    driver: bridge
