spring:
  application:
    name: msvc-auth
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://76.13.124.126:5432/sssi-bd
    username: sssi_user
    password: sssi_user
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  password:
    expiration-days: 90
    notification-days: 7,3,1

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:0x4AAAAAADEo_xVst3UEPKg1xo7CgackmKA}
  max-retries: ${TURNSTILE_MAX_RETRIES:3}
  dev-mode: ${TURNSTILE_DEV_MODE:false}