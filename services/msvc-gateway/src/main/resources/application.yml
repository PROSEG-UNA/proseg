server:
  port: 8081

spring:
  application:
    name: msvc-gateway
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://msvc-config:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.devbychris.com/realms/sssi-realm}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: msvc-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: msvc-auth-user
          uri: ${AUTH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0

        - id: msvc-auth-role
          uri: ${AUTH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=0

        - id: gateway-actuator
          uri: http://localhost:8081
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0

        - id: msvc-email
          uri: ${EMAIL_SERVICE_URL:http://localhost:9090}
          predicates:
            - Path=/api/email/**
          filters:
            - StripPrefix=2

        - id: msvc-inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0

        - id: msvc-archive
          uri: ${ARCHIVE_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/v1/archive/**
          filters:
            - StripPrefix=0

        - id: msvc-transport
          uri: ${TRANSPORT_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/transport/**
          filters:
            - StripPrefix=0

        - id: msvc-document-processor
          uri: ${DOCUMENT_PROCESSOR_SERVICE_URL:http://localhost:8098}
          predicates:
            - Path=/api/v1/document-processor/**
          filters:
            - StripPrefix=0

        - id: msvc-maintenance
          uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/maintenance/**
          filters:
            - StripPrefix=0

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174

keycloak:
  client-id: sssi-app