server:
  port: 8095

spring:
  application:
    name: msvc-inventory
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://msvc-config:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/auth/realms/proseg-realm}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/proseg-bd}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
  prefix: /api/v1/inventory

archive:
  base-url: ${ARCHIVE_BASE_URL:http://localhost:8081}

routes:
  brands: ${api.prefix}/brands
  executing-units: ${api.prefix}/executing-units
  employees: ${api.prefix}/employees
  buildings: ${api.prefix}/buildings
  locations: ${api.prefix}/locations
  campuses: ${api.prefix}/campuses
  types: ${api.prefix}/types
  models: ${api.prefix}/models
  assets: ${api.prefix}/assets
  asset-components: ${api.prefix}/components
  network-interfaces: ${api.prefix}/network-interfaces
  alarm-sensors: ${api.prefix}/assets/alarm-sensors
  images: ${api.prefix}/images
  asset-archives: ${api.prefix}/asset-archives