server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: msvc-eureka

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:msvc-eureka}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://msvc-eureka:8761/eureka/}
