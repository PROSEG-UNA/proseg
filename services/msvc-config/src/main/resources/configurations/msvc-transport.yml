server:
  port: 8097

spring:
  application:
    name: msvc-transport
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.devbychris.com/realms/sssi-realm}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

api:
  prefix: /api/v1/transport

routes:
  transport: ${api.prefix}