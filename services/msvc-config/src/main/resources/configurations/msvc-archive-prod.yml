server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: msvc-archive
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.example.com/realms/proseg-realm}

api:
  prefix: /api/v1/archive

routes:
  files: ${api.prefix}/files

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:proseg}
  region: ${MINIO_REGION:us-east-1}
  secure: ${MINIO_SECURE:false}

archive:
  max-file-size-mb: ${ARCHIVE_MAX_FILE_SIZE_MB:25}
  max-chunk-size-mb: ${ARCHIVE_MAX_CHUNK_SIZE_MB:5}
