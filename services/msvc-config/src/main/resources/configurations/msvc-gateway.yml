eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://msvc-eureka:8761/eureka}

server:
  port: 8081

spring:
  application:
    name: msvc-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.devbychris.com/realms/sssi-realm}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: msvc-auth
          uri: http://msvc-auth:8090
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: msvc-auth-user
          uri: http://msvc-auth:8090
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0

        - id: msvc-auth-role
          uri: http://msvc-auth:8090
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=0

        - id: gateway-actuator
          uri: http://msvc-gateway:8081
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0

        - id: msvc-email
          uri: http://msvc-email:9090
          predicates:
            - Path=/api/email/**
          filters:
            - StripPrefix=2

        - id: msvc-inventory
          uri: http://msvc-inventory:8095
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0

        - id: msvc-archive
          uri: http://msvc-archive:8096
          predicates:
            - Path=/api/v1/archive/**
          filters:
            - StripPrefix=0

        - id: msvc-transport
          uri: http://msvc-transport:8097
          predicates:
            - Path=/api/v1/transport/**
          filters:
            - StripPrefix=0

        - id: msvc-document-processor
          uri: http://msvc-document-processor:8098
          predicates:
            - Path=/api/v1/document-processor/**
          filters:
            - StripPrefix=0