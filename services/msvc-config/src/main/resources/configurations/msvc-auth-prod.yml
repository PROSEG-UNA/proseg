server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: msvc-auth
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://msvc-config:8888}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://auth.example.com/realms/sssi-realm}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sssi-bd}
    username: ${SPRING_DATASOURCE_USERNAME:change-me}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.security.oauth2.jwt: ${LOG_LEVEL_SPRING_SECURITY_OAUTH2_JWT:INFO}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:msvc-auth}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://msvc-eureka:8761/eureka/}

api:
  prefix: /api

routes:
  auth: ${api.prefix}/auth
  user: ${api.prefix}/user
  role: ${api.prefix}/role

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:https://auth.example.com}
  realm: ${KEYCLOAK_REALM:sssi-realm}
  client:
    id: ${KEYCLOAK_CLIENT_ID:sssi-app}
    secret: ${KEYCLOAK_CLIENT_SECRET:change-me}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:change-me}
    password: ${KEYCLOAK_ADMIN_PASSWORD:change-me}

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  password:
    expiration-days: ${APP_PASSWORD_EXPIRATION_DAYS:90}
    notification-days: ${APP_PASSWORD_NOTIFICATION_DAYS:7,3,1}

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:change-me}
  max-retries: ${TURNSTILE_MAX_RETRIES:3}
  dev-mode: ${TURNSTILE_DEV_MODE:false}
