server:
  port: 8099

spring:
  application:
    name: msvc-maintenance
  datasource:
    url: jdbc:postgresql://76.13.124.126:5432/sssi-bd
    username: sssi_user
    password: sssi_user
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:msvc-maintenance}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://msvc-eureka:8761/eureka}