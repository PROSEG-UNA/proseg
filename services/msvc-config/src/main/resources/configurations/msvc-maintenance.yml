server:
  port: 8099

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://auth.devbychris.com/realms/sssi-realm}
      client:
        registration:
          keycloak:
            client-id: msvc-maintenance
            client-secret: kIaiPowoVB4hYy7MVJnQvdQW8wv4VDuz
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: https://auth.devbychris.com/realms/sssi-realm/protocol/openid-connect/token
  application:
    name: msvc-maintenance
  datasource:
    url: jdbc:postgresql://76.13.124.126:5432/sssi-bd
    username: sssi_user
    password: sssi_user
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:msvc-maintenance}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  