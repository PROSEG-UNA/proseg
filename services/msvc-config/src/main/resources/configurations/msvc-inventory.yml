server:
  port: 8095

spring:
  application:
    name: msvc-inventory

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.devbychris.com/realms/sssi-realm}

  datasource:
    url: jdbc:postgresql://76.13.124.126:5432/sssi-bd
    username: sssi_user
    password: sssi_user
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:msvc-inventory}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://msvc-eureka:8761/eureka}

api:
  prefix: /api/v1/inventory

archive:
  base-url: ${ARCHIVE_BASE_URL:http://msvc-gateway:8081}

routes:
  brands: ${api.prefix}/brands
  locations: ${api.prefix}/locations
  campuses: ${api.prefix}/campuses
  types: ${api.prefix}/types
  models: ${api.prefix}/models
  assets: ${api.prefix}/assets
  network-interfaces: ${api.prefix}/network-interfaces
  alarm-sensors: ${api.prefix}/assets/alarm-sensors
  images: ${api.prefix}/images
  asset-archives: ${api.prefix}/asset-archives