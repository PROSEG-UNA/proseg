server:
  port: 8090

spring:
  application:
    name: msvc-auth
  kafka:
    bootstrap-servers: 76.13.124.126:9094
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.devbychris.com/realms/sssi-realm

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

api:
  prefix: /api

routes:
  auth: ${api.prefix}/auth
  user: ${api.prefix}/user
  role: ${api.prefix}/role

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:https://auth.devbychris.com}
  realm: ${KEYCLOAK_REALM:sssi-realm}
  client:
    id: ${KEYCLOAK_CLIENT_ID:sssi-app}
    secret: ${KEYCLOAK_CLIENT_SECRET:Dl8QcQxHHmu6qERkUMmUJ0qWSulRRx6y}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:sssi_user}
