server:
  port: 8096

spring:
  application:
    name: msvc-archive
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/auth/realms/proseg-realm}

api:
  prefix: /api/v1/archive

routes:
  files: ${api.prefix}/files

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:proseg-dev}
  region: ${MINIO_REGION:us-east-1}
  secure: ${MINIO_SECURE:false}

archive:
  max-file-size-mb: 25
  max-chunk-size-mb: 5